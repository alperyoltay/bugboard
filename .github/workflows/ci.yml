name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  api-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bugboard
          POSTGRES_PASSWORD: bugboard
          POSTGRES_DB: bugboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bugboard" --health-interval 3s --health-retries 10
    env:
      DATABASE_URL: postgres://bugboard:bugboard@localhost:5432/bugboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create schema
        run: psql "$DATABASE_URL" -f api/db/schema.sql
      - name: Start API against PostgreSQL
        working-directory: api
        run: |
          npm ci
          npm run build
          node dist/server.js &
          npx --yes wait-on http://localhost:4000/health
      - name: Run Postman collection with Newman
        run: npx --yes newman run postman/bugboard.postman_collection.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
